<body class="font-sans antialiased">
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4 modal-backdrop"></div>

  <script src="config.js"></script>
  <script>
    /* ---------- Backend base URL ------------------------------------------
       Config file: frontend/config.js  ->  window.DS_CONFIG.API_BASE_URL
       Priority:  ?api=<url> query param  >  config.js  >  auto (host:8000) */
    const API = (function () {
      const cfg = (window.DS_CONFIG && window.DS_CONFIG.API_BASE_URL) || '';
      let base = '';
      try { base = new URLSearchParams(location.search).get('api') || ''; } catch (e) {}
      if (!base) base = cfg;
      if (base) return String(base).replace(/\/+$/, '');
      const host = (location.hostname && location.hostname !== '') ? location.hostname : '127.0.0.1';
      return (location.protocol === 'https:' ? 'https://' : 'http://') + host + ':8000';
    })();
    const state = { token: localStorage.getItem('ds_token')||null, refreshToken: localStorage.getItem('ds_refresh_token')||null, user: null, profile: null, reportId: null, imageUrl: null, tab: 'detect', authMode: 'login', selectedMechanic: null, selectedDamages: [], carBrand: null };

    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function toast(msg, kind='info') {
      const t = $('#toast');
      const color = kind==='error'?'text-red-300':kind==='success'?'text-emerald-300':'text-cyan-200';
      t.innerHTML = '<span class="'+color+'">'+msg+'</span>';
      t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 3400);
    }

    async function refreshAuth() {
      if (!state.refreshToken) return false;
      try {
        const res = await fetch(API + '/api/v1/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: state.refreshToken })
        });
        const data = await res.json();
        if (!res.ok || !data.session) return false;
        state.token = data.session.access_token;
        state.refreshToken = data.session.refresh_token;
        localStorage.setItem('ds_token', state.token);
        localStorage.setItem('ds_refresh_token', state.refreshToken);
        if (data.user) state.user = data.user;
        return true;
      } catch (e) { return false; }
    }

    async function api(path, opts) {
      opts = opts || {};
      const doFetch = function() {
        const headers = Object.assign({}, opts.headers || {});
        if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
        if (opts.json) { headers['Content-Type']='application/json'; opts.body = JSON.stringify(opts.json); }
        return fetch(API+path, Object.assign({}, opts, {headers:headers}));
      };
      let res = await doFetch();
      if (res.status === 401 && state.refreshToken) {
        const ok = await refreshAuth();
        if (ok) res = await doFetch();
      }
      const ct = res.headers.get('content-type')||'';
      let data = null;
      if (ct.includes('application/json')) data = await res.json(); else data = await res.text();
      if (!res.ok) { const m = (data && data.error && data.error.message) || (typeof data==='string'?data:'Request failed'); throw new Error(m); }
      return data;
    }

    function displayName() {
      return (state.profile && state.profile.full_name) || (state.user && state.user.user_metadata && state.user.user_metadata.full_name) || (state.user && state.user.email) || 'Signed in';
    }

    function initials() {
      const n = displayName().trim();
      const parts = n.split(/\s+/).filter(Boolean);
      if (!parts.length) return 'D';
      return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
    }

    function decodeJwt(token) {
      try {
        const parts = token.split('.');
        if (parts.length !== 3) return null;
        const payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
        return payload;
      } catch(e) { return null; }
    }

    function requestLocation() {
      if (!navigator.geolocation) return;
      if (localStorage.getItem('ds_lat') && localStorage.getItem('ds_lng')) return;
      navigator.geolocation.getCurrentPosition(function(pos){
        localStorage.setItem('ds_lat', pos.coords.latitude);
        localStorage.setItem('ds_lng', pos.coords.longitude);
      }, function(){}, {enableHighAccuracy:true, timeout:10000, maximumAge:600000});
    }

    async function loadMe() {
      if (!state.token) return;
      try {
        const d = await api('/api/v1/auth/me');
        state.user = d.user || d;
        state.profile = d.profile || null;
      } catch(e) {
        const p = decodeJwt(state.token);
        if (p && (p.sub || p.user_id)) {
          state.user = {
            id: p.sub || p.user_id,
            email: p.email,
            user_metadata: p.user_metadata || (p.app_metadata || {}),
          };
          state.profile = state.profile || (p.user_metadata ? { full_name: p.user_metadata.full_name } : null);
        } else {
          state.token = null; state.refreshToken = null; localStorage.removeItem('ds_token'); localStorage.removeItem('ds_refresh_token');
        }
      }
    }

    /* ---------- shell ---------- */

                </div>
                <p class="mt-6 sm:mt-8 text-base sm:text-xl text-gray-300 max-w-xl leading-relaxed">Upload photo of Car we found Nearest Mechanic for you and Estimated lower price with direct contact of mechanic</p>
                <div class="mt-7 sm:mt-10 flex flex-col sm:flex-row gap-3 sm:gap-4">

    function renderPanel() {
      const p = document.getElementById('panel');
      if (!p) return;
      p.innerHTML = detectPanel();
      bindPanel();
    }

    function bindPanel() {
      const bv = document.getElementById('detectBrand'); if (bv) { if (state.carBrand) bv.value = state.carBrand; bv.addEventListener('change', function(){ state.carBrand = bv.value || null; }); }
      const df = document.getElementById('detectFile'); if (df) df.addEventListener('change', function(){ const f = df.files[0]; const el = document.getElementById('selectedFileName'); if (el) el.textContent = f ? 'Selected: ' + f.name : ''; });
      const dc = document.getElementById('detectCamera'); if (dc) dc.addEventListener('change', function(){ const f = dc.files[0]; const el = document.getElementById('selectedFileName'); if (el) el.textContent = f ? 'Captured: ' + f.name : ''; });
      const db = document.getElementById('detectBtn'); if (db) db.addEventListener('click', doDetect);
      const dz = document.getElementById('dropZone'); if (dz) {
        const dragOver = function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add('border-cyan-400/60'); };
        const dragLeave = function(){ dz.classList.remove('border-cyan-400/60'); };
        const drop = function(e){
          e.preventDefault(); e.stopPropagation(); dz.classList.remove('border-cyan-400/60');
          const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) {
            const dt = new DataTransfer(); dt.items.add(f);
            const fi = document.getElementById('detectFile'); fi.files = dt.files;
            const el = document.getElementById('selectedFileName'); if (el) el.textContent = 'Dropped: ' + f.name;
          }
        };
        dz.addEventListener('dragover', dragOver);
        dz.addEventListener('dragleave', dragLeave);
        dz.addEventListener('drop', drop);
        // Mobile: tapping anywhere in the card opens the gallery picker.
        dz.addEventListener('click', function(e){
          if (e.target && e.target.closest && e.target.closest('label,button,input,a')) return;
          const fi = document.getElementById('detectFile'); if (fi) fi.click();
        });
      }
    }

    function bind(root) {

      const ol2 = root.querySelector('#openLogin2'); if (ol2) ol2.addEventListener('click', function(){ openAuth('login'); });
      const cs = root.querySelector('#ctaStart'); if (cs) cs.addEventListener('click', function(){ openAuth('signup'); });
      const cs2 = root.querySelector('#ctaStart2'); if (cs2) cs2.addEventListener('click', function(){ openAuth('signup'); });
      const cd = root.querySelector('#ctaDemo'); if (cd) cd.addEventListener('click', function(){ var el=document.getElementById('howitworks'); if(el) el.scrollIntoView({behavior:'smooth'}); });

    /* ---------- auth ---------- */
    function openAuth(mode) {
      state.authMode = mode || 'login';
      const m = document.getElementById('modal');
      m.classList.remove('hidden'); m.classList.add('flex');
      m.innerHTML = '<div class="glass-strong modal-sheet rounded-t-3xl sm:rounded-3xl p-5 sm:p-8 w-full max-w-md fade-in shadow-glow2">'+
        '<div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-4 sm:hidden"></div>'+
        '<div class="flex items-center justify-between mb-5 sm:mb-6"><h3 class="font-display text-xl sm:text-2xl font-bold">'+(state.authMode==='login'?'Welcome back':'Create account')+'</h3><button id="closeModal" class="btn-ghost rounded-xl w-10 h-10 flex items-center justify-center text-gray-400" aria-label="Close">✕</button></div>'+
        '<div class="flex gap-2 mb-5 sm:mb-6 p-1.5 glass rounded-2xl">'+
          '<button data-mode="login" class="tab flex-1 py-3 rounded-xl text-sm '+(state.authMode==='login'?'active':'')+'">Sign in</button>'+
          '<button data-mode="signup" class="tab flex-1 py-3 rounded-xl text-sm '+(state.authMode==='signup'?'active':'')+'">Sign up</button>'+
        '</div>'+
        '<div id="authForm" class="space-y-3"></div><div id="authErr" class="text-xs text-red-300 mt-3"></div></div>';
      renderAuthForm(state.authMode);
      document.getElementById('closeModal').addEventListener('click', closeModal);
      m.querySelectorAll('[data-mode]').forEach(function(b){ b.addEventListener('click', function(){ state.authMode=b.dataset.mode; renderAuthForm(state.authMode); m.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.toggle('active', x.dataset.mode===state.authMode); }); }); });
    }
    function closeModal() { const m=document.getElementById('modal'); m.classList.add('hidden'); m.classList.remove('flex'); m.innerHTML=''; }
    function renderAuthForm(mode) {
      const f = document.getElementById('authForm');
      const eye = '<button type="button" id="togglePass" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-cyan-300 transition" aria-label="Show password"><svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button>';
      if (mode === 'login') {
        f.innerHTML = '<input id="aEmail" type="email" placeholder="Email" class="input w-full rounded-2xl px-4 py-4 sm:py-3.5 text-sm" />'+
          '<div class="relative"><input id="aPass" type="password" placeholder="Password" class="input w-full rounded-2xl px-4 py-4 sm:py-3.5 pr-12 text-sm" />'+eye+'</div>'+
          '<button id="aSubmit" class="btn-primary w-full rounded-2xl py-3.5 text-sm font-semibold">Sign in</button>';
        document.getElementById('aSubmit').addEventListener('click', doLoginModal);
        document.getElementById('togglePass').addEventListener('click', togglePass);
      } else {
        f.innerHTML = '<input id="aName" placeholder="Full name (optional)" class="input w-full rounded-2xl px-4 py-4 sm:py-3.5 text-sm" />'+
          '<input id="aEmail" type="email" placeholder="Email" class="input w-full rounded-2xl px-4 py-4 sm:py-3.5 text-sm" />'+
          '<div class="relative"><input id="aPass" type="password" placeholder="Password (8+ chars, letter + digit)" class="input w-full rounded-2xl px-4 py-4 sm:py-3.5 pr-12 text-sm" />'+eye+'</div>'+
          '<button id="aSubmit" class="btn-primary w-full rounded-2xl py-3.5 text-sm font-semibold">Create account</button>';
        document.getElementById('aSubmit').addEventListener('click', doSignupModal);
        document.getElementById('togglePass').addEventListener('click', togglePass);
      }
    }
    function togglePass() {
      const inp = document.getElementById('aPass');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.027m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>'; }
      else { inp.type = 'password'; icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>'; }
    }
    async function doLoginModal() {
      const email = document.getElementById('aEmail').value.trim();
      const password = document.getElementById('aPass').value;
      if (!email||!password) { document.getElementById('authErr').textContent='Email and password required'; return; }
      try {
        const d = await api('/api/v1/auth/login', { method:'POST', json:{email, password} });
        state.token = d.session.access_token; state.refreshToken = d.session.refresh_token; localStorage.setItem('ds_token', state.token); localStorage.setItem('ds_refresh_token', state.refreshToken); state.user = d.user;
        await loadMe(); requestLocation(); closeModal(); toast('Signed in','success'); render();
      } catch(e){ document.getElementById('authErr').textContent = e.message; }
    }
    async function doSignupModal() {
      const email = document.getElementById('aEmail').value.trim();
      const password = document.getElementById('aPass').value;
      const full_name = (document.getElementById('aName')||{}).value||null;
      if (!email||!password) { document.getElementById('authErr').textContent='Email and password required'; return; }
      try {
        const d = await api('/api/v1/auth/signup', { method:'POST', json:{email, password, full_name: full_name?full_name.trim():null} });
        if (d.session && d.session.access_token) { state.token = d.session.access_token; state.refreshToken = d.session.refresh_token; localStorage.setItem('ds_token', state.token); localStorage.setItem('ds_refresh_token', state.refreshToken); state.user = d.user; await loadMe(); requestLocation(); closeModal(); toast('Account created','success'); render(); }
        else { document.getElementById('authErr').textContent = d.message || 'Account created. Please sign in.'; }
      } catch(e){ document.getElementById('authErr').textContent = e.message; }
    }
    async function doLogout() {
      try { await api('/api/v1/auth/logout', {method:'POST'}); } catch(e){}
      state.token=null; state.refreshToken=null; state.user=null; localStorage.removeItem('ds_token'); localStorage.removeItem('ds_refresh_token');
      toast('Signed out','success'); render();
    }

    /* ---------- actions ---------- */
    async function doDetect() {
      if (!state.token) { openAuth('login'); return; }
      const fileInput = document.getElementById('detectFile');
      const camInput = document.getElementById('detectCamera');
      const file = (camInput && camInput.files && camInput.files[0]) || (fileInput && fileInput.files && fileInput.files[0]);
      if (!file) { toast('Choose or capture an image first','error'); return; }
      const btn = document.getElementById('detectBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span><span class="ml-2">Analysing…</span>';
      const st = document.getElementById('detectStatus'); st.innerHTML='<span class="status-pill"><span class="pulse-dot"></span>Checking damage…</span>';
      try {
        const fd = new FormData(); fd.append('file', file);
        const brandEl = document.getElementById('detectBrand');
        const brand = brandEl ? brandEl.value.trim() : '';
        if (brand) fd.append('label', brand);
        state.carBrand = brand || null;
        const lat = localStorage.getItem('ds_lat'); const lng = localStorage.getItem('ds_lng');
        if (lat) fd.append('lat', lat);
        if (lng) fd.append('lng', lng);
        const d = await api('/api/v1/damage/detect', {method:'POST', body:fd});
        state.reportId = d.report_id; state.imageUrl = d.image_url;
        const img = document.getElementById('detectImg');
        img.src = d.image_url; img.classList.remove('hidden');
        const noDamage = (d.detection_count === 0);
        const res = document.getElementById('detectResult'); res.classList.remove('hidden');
        if (noDamage) {
          res.innerHTML = '<div class="flex items-center gap-3 glass rounded-2xl p-4">' +
            '<div class="w-10 h-10 rounded-xl bg-amber-400/20 flex items-center justify-center"><svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>' +
            '<div><div class="text-sm font-semibold text-amber-300">No Damage Detected</div>' +
            '<div class="text-xs text-gray-400 mt-0.5">The model found no damage in this photo</div></div></div>';
          st.innerHTML = '<span class="status-pill"><span style="width:.5rem;height:.5rem;border-radius:999px;background:#fbbf24;box-shadow:0 0 10px #fbbf24"></span>No damage detected</span>';
          toast('No damage detected','info');
          ['detectDamageList','detectMechanics','detectMessage'].forEach(function(id){ const x = document.getElementById(id); if (x) { x.classList.add('hidden'); x.innerHTML=''; } });
          const cb = document.getElementById('detectCanvas'); if (cb) { cb.classList.add('hidden'); cb.getContext('2d').clearRect(0,0,cb.width,cb.height); }
        } else {
          res.innerHTML = '<div class="flex items-center gap-3 glass rounded-2xl p-4">' +
            '<div class="w-10 h-10 rounded-xl bg-emerald-400/20 flex items-center justify-center"><svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>' +
            '<div><div class="text-sm font-semibold text-emerald-300">Damage Detected</div></div></div>';
          st.innerHTML='<span class="status-pill"><span style="width:.5rem;height:.5rem;border-radius:999px;background:#34d399;box-shadow:0 0 10px #34d399"></span>Damage Detected</span>';
          toast('Damage Detected','success');
          setTimeout(function(){ drawBoxesOnCanvas('detectCanvas', d.image_url, d.report_id); renderDamagesWithPrice(d.report_id); }, 100);
        }
      } catch(e){ toast(e.message,'error'); st.textContent=e.message; }
      finally { btn.disabled=false; btn.innerHTML='<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg> Detect damage'; }
    }

    async function renderDamagesWithPrice(rid) {
      const el = document.getElementById('detectDamageList');
      if (!el || !rid) return;
      let rep;
      try {
        rep = await api('/api/v1/damage/reports/' + rid);
      } catch(e) { return; }
      const seen = new Set(); const uniq = [];
      for (const d of (rep.detections || [])) {
        if (seen.has(d.damage_class)) continue;
        seen.add(d.damage_class); uniq.push(d);
      }
      if (!uniq.length) {
        el.classList.remove('hidden');
        el.innerHTML = '<div class="mt-4 flex items-center gap-3 glass rounded-2xl p-4">' +
          '<div class="w-10 h-10 rounded-xl bg-amber-400/20 flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>' +
          '<div><div class="text-sm font-semibold text-amber-300">No Damage Detected</div>' +
          '<div class="text-xs text-gray-400 mt-0.5">The model found no damage in this photo</div></div></div>';
        const dmsg = document.getElementById('detectMessage');
        if (dmsg) { dmsg.classList.remove('hidden'); dmsg.innerHTML = ''; delete dmsg.dataset.damages; }
        const mech = document.getElementById('detectMechanics'); if (mech) { mech.classList.add('hidden'); mech.innerHTML = ''; }
        return;
      }
      let priced = null;
      try {
        priced = await api('/api/v1/pricing/estimate', { method: 'POST', json: { report_id: rid } });
      } catch(e) { priced = null; }
      const priceMap = {};
      if (priced && priced.items) priced.items.forEach(function(it){ priceMap[it.damage_class] = it.price; });
      const colors = ['#22d3ee','#a78bfa','#34d399','#fbbf24','#f87171','#fb923c'];
      el.classList.remove('hidden');
      el.innerHTML = '<div class="mt-4"><div class="text-sm font-semibold text-gray-300 mb-3">Damages & prices</div>' +
        '<div class="grid sm:grid-cols-2 gap-3">' +
        uniq.map(function(d, i){
          const c = colors[i % colors.length];
          const price = priceMap[d.damage_class];
          return '<div class="glass rounded-2xl p-4 flex items-center gap-3">' +
            '<div class="w-3 h-3 rounded-full" style="background:'+c+';box-shadow:0 0 8px '+c+'"></div>' +
            '<div class="flex-1">' +
              '<div class="text-sm font-medium text-white">' + d.damage_class + '</div>' +
              '<div class="text-xs text-gray-400 mt-0.5">' + (d.damage_area_percentage != null ? d.damage_area_percentage + '% of image' : '') + '</div>' +
            '</div>' +
            '<div class="text-base font-semibold text-cyan-300">' + (price != null ? '₨ ' + price.toLocaleString() : '—') + '</div>' +
          '</div>';
        }).join('') +
        '</div>' +
        '<div class="mt-4 rounded-2xl px-4 sm:px-5 py-4 flex items-center justify-between gap-3 bg-gradient-to-r from-emerald-400/15 via-cyan-400/10 to-violet-500/10 border border-emerald-400/20">' +
          '<span class="font-display font-bold text-base sm:text-lg text-emerald-300">TOTAL</span>' +
          '<span class="font-display text-2xl sm:text-3xl font-bold text-emerald-300">₨ ' + (priced && priced.total != null ? priced.total.toLocaleString() : '—') + '</span>' +
        '</div>' +
      '</div>';
      const dmsg = document.getElementById('detectMessage');
      if (dmsg) { dmsg.classList.remove('hidden'); dmsg.dataset.damages = JSON.stringify(uniq.map(function(d){ return d.damage_class; })); }
      generateDamageMessage(rid);
      const mech = document.getElementById('detectMechanics'); if (mech) mech.classList.remove('hidden');
      renderNearbyMechanics('detectMechanics');
    }

    async function renderNearbyMechanics(containerId) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const lat = localStorage.getItem('ds_lat'); const lng = localStorage.getItem('ds_lng');
      if (!lat || !lng) { el.innerHTML = '<div class="text-xs text-gray-400">Location not available.</div>'; return; }
      try {
        const d = await api('/api/v1/mechanics/nearby?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng));
        const places = d.mechanics || [];
        if (!places.length) { el.innerHTML = '<div class="text-xs text-gray-400">No car-repair shops found within 10 km.</div>'; return; }
        el.innerHTML = '<div class="text-sm font-semibold text-white mt-6 mb-3">Nearby mechanics (tap to select)</div>' +
          '<div class="space-y-2.5 sm:space-y-3">' +
          places.map(function(p) {
            const km = (p.distance_m / 1000).toFixed(1);
            const maps = 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng;
            const isSel = state.selectedMechanic && state.selectedMechanic.name === p.name && Math.abs(state.selectedMechanic.lat - p.lat) < 0.0001;
            return '<button class="mech-card glass w-full rounded-2xl p-4 flex items-center gap-3 transition text-left ' + (isSel ? 'ring-2 ring-cyan-400/60 border-cyan-400/40' : 'hover:border-cyan-400/40') + '" data-mech="1" data-name="' + (p.name || 'Car repair').replace(/"/g, '&quot;') + '" data-lat="' + p.lat + '" data-lng="' + p.lng + '" data-phone="' + (p.phone || '') + '" data-address="' + ((p.address || '').replace(/"/g, '&quot;')) + '">' +
              '<div class="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-400/25 to-amber-400/5 text-amber-300 flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>' +
              '<div class="flex-1 min-w-0">' +
                '<div class="text-sm font-semibold text-white">' + (p.name || 'Car repair') + '</div>' +
                '<div class="text-xs text-gray-400 mt-0.5">' + km + ' km away' + (p.address ? ' · ' + p.address : '') + '</div>' +
                (p.phone ? '<div class="text-xs text-cyan-300 mt-1">' + p.phone + '</div>' : '') +
                (p.opening_hours ? '<div class="text-[10px] text-gray-500 mt-1">' + p.opening_hours + '</div>' : '') +
              '</div>' +
              '<a href="' + maps + '" target="_blank" rel="noopener" class="btn-ghost rounded-xl p-3 shrink-0 hover:bg-white/10" aria-label="View on Google Maps" onclick="event.stopPropagation()">' +
                '<svg class="w-6 h-6 text-cyan-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' +
              '</a>' +
            '</button>';
          }).join('') +
          '</div>';
        el.querySelectorAll('.mech-card').forEach(function(btn) {
          btn.addEventListener('click', function() {
            state.selectedMechanic = {
              name: btn.dataset.name,
              lat: parseFloat(btn.dataset.lat),
              lng: parseFloat(btn.dataset.lng),
              phone: btn.dataset.phone || null,
              address: btn.dataset.address || null,
            };
            renderNearbyMechanics('detectMechanics');
            if (state.reportId) generateDamageMessage(state.reportId);
          });
        });
      } catch(e) { el.innerHTML = '<div class="text-xs text-red-300">' + e.message + '</div>'; }
    }

    async function generateDamageMessage(rid) {
      const el = document.getElementById('detectMessage');
      if (!el || !rid) return;
      const damages = el.dataset.damages ? JSON.parse(el.dataset.damages) : [];
      if (!damages.length) return;
      try {
        const brandEl = document.getElementById('detectBrand');
        const carBrand = state.carBrand || (brandEl && brandEl.value ? brandEl.value : null);
        const body = { user_id: state.user.id, report_id: rid, damage_classes: damages, mechanic_name: state.selectedMechanic ? state.selectedMechanic.name : null, car_brand: carBrand };
        const d = await api('/api/v1/message_made', { method: 'POST', json: body });
        const lat = localStorage.getItem('ds_lat');
        const lng = localStorage.getItem('ds_lng');
        const image_url = state.imageUrl || '';
        const waText = d.message + '\n\nImage: ' + image_url + '\nLocation: https://www.google.com/maps?q=' + lat + ',' + lng;
        const waTarget = (state.selectedMechanic && state.selectedMechanic.phone) ? (function(p){ const digits = (p||'').replace(/\D/g,''); return digits.startsWith('0') ? '92' + digits.slice(1) : digits; })(state.selectedMechanic.phone) : '923034124938';
        const waLink = 'https://wa.me/' + waTarget + '?text=' + encodeURIComponent(waText);
        const mechLabel = state.selectedMechanic && state.selectedMechanic.name ? state.selectedMechanic.name : 'Mechanic';
        el.innerHTML = '<div class="glass rounded-2xl p-4 sm:p-5 mt-2">' +
          '<div class="flex items-center justify-between gap-3 mb-3">' +
            '<div class="flex flex-col min-w-0">' +
              '<span class="text-[10px] sm:text-[11px] uppercase tracking-widest text-cyan-300">Message to</span>' +
              '<span class="text-sm font-semibold text-white truncate">' + mechLabel + '</span>' +
            '</div>' +
            '<button id="regenMsgBtn" class="btn-ghost rounded-xl px-3.5 py-2 text-xs shrink-0">Regenerate</button>' +
          '</div>' +
          '<p class="whitespace-pre-wrap text-sm leading-relaxed text-gray-200">' + d.message + '</p>' +
          '<a href="' + waLink + '" target="_blank" rel="noopener" class="mt-4 inline-flex w-full items-center justify-center gap-3 rounded-2xl px-6 py-3.5 min-h-[50px] text-sm font-semibold text-white transition hover:-translate-y-0.5" style="background:#25D366;box-shadow:0 10px 30px -10px rgba(37,211,102,0.6)">' +
            '<svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 2.1.55 4.14 1.6 5.95L2.1 22l4.33-1.57c1.73.94 3.68 1.44 5.61 1.44 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.15c-1.72 0-3.4-.46-4.88-1.33l-.35-.21-2.87 1.04 1.02-2.8-.23-.38a8.18 8.18 0 01-1.27-4.36c0-4.52 3.68-8.2 8.2-8.2 2.19 0 4.25.86 5.81 2.42 1.56 1.56 2.42 3.62 2.42 5.81 0 4.52-3.69 8.2-8.31 8.2zm4.52-6.16c-.25-.12-1.46-.72-1.69-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.79.97-.14.16-.29.18-.54.06a6.7 6.7 0 01-1.96-1.21 7.35 7.35 0 01-1.37-1.7c-.15-.25 0-.39.1-.51.1-.1.23-.27.34-.4.11-.14.15-.23.23-.39.08-.15.04-.29-.02-.4-.06-.12-.56-1.35-.76-1.85-.2-.48-.4-.42-.55-.42-.14 0-.3 0-.46 0a.88.88 0 00-.63.3c-.22.24-.85.83-.85 2.02 0 1.2.87 2.35.99 2.51.12.16 1.7 2.6 4.12 3.65.58.25 1.03.4 1.38.51.58.19 1.1.16 1.52.1.46-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.14-1.17-.06-.1-.22-.16-.46-.28z"/></svg>' +
            'WhatsApp — send to ' + mechLabel +
          '</a>' +
        '</div>';
        const rb = document.getElementById('regenMsgBtn'); if (rb) rb.addEventListener('click', function(){ generateDamageMessage(rid); });
      } catch(e) { /* silent */ }
    }

    function drawBoxesOnCanvas(canvasId, url, rid) {
      const canvas = document.getElementById(canvasId);
      const img = document.getElementById(canvasId==='detectCanvas'?'detectImg':'drawImg');
      if (!img) return;
      const doDraw = function(boxes) {
        if (!img.complete || !img.naturalWidth) {
          img.onload = function() { doDraw(boxes); };
          return;
        }
        const w = img.naturalWidth, h = img.naturalHeight;
        canvas.width = w; canvas.height = h;
        canvas.style.width = '100%'; canvas.style.height = 'auto';
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const colors = ['#22d3ee','#a78bfa','#34d399','#fbbf24','#f87171','#fb923c'];
        (boxes.boxes || []).forEach(function(b, i) {
          const c = colors[i % colors.length];
          const x = b.x, y = b.y, bw = b.width, bh = b.height;
          ctx.globalAlpha = 0.85;
          ctx.shadowColor = c; ctx.shadowBlur = 12;
          ctx.strokeStyle = c; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.roundRect(x - bw/2, y - bh/2, bw, bh, 8); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = c + '18'; ctx.fill();
          const label = (b.damage_class || '') + (b.confidence != null ? '  ' + (b.confidence*100).toFixed(0) + '%' : '');
          ctx.font = 'bold 12px Inter, sans-serif';
          const tw = ctx.measureText(label).width + 12;
          const lx = x - bw/2, ly = y - bh/2 - 22;
          ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(lx, ly, tw, 20, 6); ctx.fill();
          ctx.fillStyle = '#0a0e1a'; ctx.fillText(label, lx + 6, ly + 14);
          ctx.globalAlpha = 1.0;
        });
      };
      api('/api/v1/damage/reports/' + rid)
        .then(function(rep) {
          const boxes = {
            image_url: rep.image_url,
            boxes: (rep.detections || []).map(function(d) {
              return { damage_class: d.damage_class, x: d.x, y: d.y, width: d.width, height: d.height, confidence: d.confidence };
            })
          };
          doDraw(boxes);
        })
        .catch(function(e) { toast(e.message, 'error'); });
    }

    function render() {
      const root = document.getElementById('app');
      root.innerHTML = '';
      const node = document.createElement('div');
      node.innerHTML = state.user ? appShell() : landing();
      root.appendChild(node);
      bind(node);
      if (state.user) {
        try { renderPanel(); } catch(e) { console.error('renderPanel error:', e); }
      }
    }

    function boot() {
      // restore: if token exists, try to refresh then loadMe
      (async function(){
        if (state.token && state.refreshToken) { try { await refreshAuth(); } catch(e) {} }
        await loadMe();
        if (state.token) requestLocation();
        render();
      })();
    }

    boot();
  </script>
</body>
</html>
